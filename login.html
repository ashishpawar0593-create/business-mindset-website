<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Business Mindset</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: #fff;
      min-height: 100vh;
      padding: 25px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .logo span {
      color: #ffa500;
    }

    .tagline {
      color: #aaa;
      text-align: center;
      margin-top: 5px;
      font-size: 13px;
    }

    .card {
      background: #141414;
      border: 1px solid #303030;
      border-radius: 25px;
      padding: 30px 24px;
    }

    .label-top {
      color: #ffad18;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 37px;
      margin-bottom: 14px;
    }

    .subtitle {
      color: #888;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      color: #bbb;
      font-weight: bold;
      margin: 22px 0 10px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 17px;
      background: #202020;
      border: 1px solid #393939;
      border-radius: 15px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ffa500;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #aaa;
      margin: 0;
    }

    .remember input {
      accent-color: #ffa500;
    }

    a {
      color: #ffad18;
      text-decoration: none;
    }

    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 50px;
      padding: 19px;
      background: linear-gradient(90deg, #ffbd25, #ff9700);
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 25px;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .bottom {
      text-align: center;
      color: #888;
      margin-top: 28px;
      line-height: 1.8;
    }

    .message {
      margin-top: 15px;
      color: #ff6969;
      line-height: 1.5;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .message.success {
      color: #ffbd25;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">
      Business <span>Mindset</span>
      <div class="tagline">Build Your Future With Us</div>
    </div>

    <section class="card">
      <div class="label-top">ACCOUNT</div>

      <h1>Sign In</h1>

      <p class="subtitle">
        Welcome back! Please enter your details.
      </p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember">
            Remember me
          </label>

          <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>

        <button type="submit" class="btn" id="loginBtn">
          Sign In &nbsp; →
        </button>

        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <div class="bottom">
        Don't have an account?
        <a href="signup.html"><b>Sign Up</b></a>
      </div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      sendPasswordResetEmail
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMNQEUc7gF3XjduXe5w792thNwsIvE76A",
      authDomain: "business-mindset-ac77c.firebaseapp.com",
      projectId: "business-mindset-ac77c",
      storageBucket: "business-mindset-ac77c.firebasestorage.app",
      messagingSenderId: "885202475978",
      appId: "1:885202475978:web:25dabcd326a26965724d33",
      measurementId: "G-LG873JC1N4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberInput = document.getElementById("remember");
    const button = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.classList.toggle("success", success);
    }

    function friendlyError(error) {
      switch (error.code) {
        case "auth/invalid-credential":
        case "auth/user-not-found":
        case "auth/wrong-password":
          return "Invalid email or password.";

        case "auth/invalid-email":
          return "Invalid email address.";

        case "auth/user-disabled":
          return "This account has been disabled.";

        case "auth/too-many-requests":
          return "Too many attempts. Please try again later.";

        case "auth/network-request-failed":
          return "Network error. Please check your internet connection.";

        case "auth/operation-not-allowed":
          return "Email/Password sign-in is not enabled in Firebase.";

        default:
          return "Login failed. Please try again.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      button.disabled = true;
      button.textContent = "Signing in...";
      showMessage("");

      try {
        await setPersistence(
          auth,
          rememberInput.checked
            ? browserLocalPersistence
            : browserSessionPersistence
        );

        await signInWithEmailAndPassword(auth, email, password);

        showMessage("Login successful! Opening Dashboard...", true);

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);

      } catch (error) {
        console.error("Firebase login error:", error.code);

        showMessage(friendlyError(error));
        button.disabled = false;
        button.textContent = "Sign In →";
      }
    });

    document
      .getElementById("forgotPassword")
      .addEventListener("click", async (event) => {
        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
          showMessage("Enter your email address first.");
          emailInput.focus();
          return;
        }

        try {
          await sendPasswordResetEmail(auth, email);

          showMessage(
            "If the account exists, a password reset email has been sent.",
            true
          );

        } catch (error) {
          console.error("Password reset error:", error.code);

          showMessage(
            "Unable to send reset email. Check your email and Firebase settings."
          );
        }
      });
  </script>
</body>
</html>
